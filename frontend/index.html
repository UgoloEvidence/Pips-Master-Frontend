<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pips Master Academy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f7fb;--panel:#fff;--panel2:#eef2f7;--text:#111827;--muted:#64748b;--line:#e2e8f0;--accent:#10b981;--accent2:#06b6d4;--gold:#f59e0b;--red:#ef4444;--shadow:0 12px 35px rgba(15,23,42,.08)}
body.dark{--bg:#071019;--panel:#0d1721;--panel2:#111f2c;--text:#eef6f7;--muted:#9fb0bc;--line:#20313f;--shadow:0 14px 40px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand{font-weight:800;letter-spacing:.5px}.top-actions{display:flex;gap:8px;align-items:center}.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);width:42px;height:42px;border-radius:12px}.badge-dot{position:absolute;background:var(--red);width:8px;height:8px;border-radius:50%;right:8px;top:7px}.bellwrap{position:relative}.layout{display:grid;grid-template-columns:245px 1fr}.side{position:sticky;top:70px;height:calc(100vh - 70px);border-right:1px solid var(--line);background:var(--panel);padding:18px 12px;overflow:auto}.nav{width:100%;padding:11px 13px;border:0;background:transparent;color:var(--muted);border-radius:11px;text-align:left;margin:3px 0;font-weight:600}.nav:hover,.nav.active{background:var(--panel2);color:var(--text)}main{padding:28px;max-width:1500px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}.h1{font-size:30px;font-weight:800;margin:5px 0}.muted{color:var(--muted)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-height:120px}.mini .label{font-size:12px;color:var(--muted);font-weight:700}.mini .value{font-size:20px;font-weight:800;margin-top:9px}.rank-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:linear-gradient(135deg,#0ea5e9,#10b981);color:white;font-size:11px;font-weight:800;margin-top:8px}.progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.cards{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h3{margin:0 0 12px;font-size:16px}.trend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.trendcard{border-radius:14px;padding:13px;text-align:center;color:white;font-weight:800}.bull{background:#059669}.bear{background:#dc2626}.neutral{background:#d97706}.unavail{background:#64748b}.section{display:none}.section.active{display:block}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.select,.input,.textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:11px}.toolbar .select{width:auto;min-width:130px}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--accent);color:white;font-weight:800}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.red{background:var(--red)}.scanner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.signal{border:1px solid var(--line);border-radius:17px;padding:16px;background:var(--panel2)}.signal.buy{border-color:#10b981}.signal.sell{border-color:#ef4444}.signalhead{display:flex;justify-content:space-between;align-items:start}.direction{font-size:20px;font-weight:900}.buytext{color:#10b981}.selltext{color:#ef4444}.conf{font-size:30px;font-weight:900}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.level{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:12px}.level small{display:block;color:var(--muted);font-size:10px}.level strong{display:block;margin-top:5px}.copy{float:right;border:0;background:transparent;color:var(--accent);font-weight:800;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{font-size:11px;border:1px solid var(--line);padding:6px 8px;border-radius:99px;background:var(--panel)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap}.notifpanel{position:fixed;right:18px;top:64px;width:min(390px,calc(100vw - 30px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:40;padding:12px;display:none}.notifpanel.open{display:block}.notif{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.notif:last-child{border-bottom:0}.notiftitle{font-weight:800;font-size:13px}.small{font-size:11px;color:var(--muted)}.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}.place{padding:16px;text-align:center;border:1px solid var(--line);border-radius:15px;background:var(--panel2)}.first{min-height:125px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--panel2)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mobilebar{display:none}.empty{text-align:center;padding:30px;color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:white;padding:12px 15px;border-radius:12px;display:none;z-index:60}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(450px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
@media(max-width:1050px){.layout{grid-template-columns:82px 1fr}.side .nav{font-size:0;text-align:center}.side .nav::first-letter{font-size:18px}.grid4{grid-template-columns:repeat(2,1fr)}.cards,.scanner-grid{grid-template-columns:1fr}.trend{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.top{padding:0 12px}.mobilebar{display:block}.layout{display:block}.side{position:fixed;left:-280px;top:0;height:100vh;width:260px;z-index:50;transition:.2s}.side.open{left:0}.side .nav{font-size:13px;text-align:left}.menuicon{display:block}.top .brand{font-size:14px}main{padding:16px}.grid4{grid-template-columns:repeat(2,1fr);gap:8px}.mini{min-height:108px;padding:13px}.trend{grid-template-columns:repeat(3,1fr)}.levels{grid-template-columns:repeat(2,1fr)}.row,.formgrid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.toolbar .select{width:100%}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>
const API=(localStorage.getItem('PMA_API_BASE')||'https://pips-master-frontend.onrender.com').replace(/\/$/,'');
let token=localStorage.getItem('PMA_TOKEN'), me=null, prefs={trading_style:'Scalping',trigger_tf:'5m',markets:'Forex',theme:'dark',signal_notifications:true}, current='home', scanCache=[];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
async function api(path,opts={}){let headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;let r=await fetch(API+'/api'+path,{...opts,headers});let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.detail||'Request failed');return x}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function theme(){document.body.classList.toggle('dark',prefs.theme==='dark')}
function escape(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function shell(){document.querySelector('#root').innerHTML=`<div class="app"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="iconbtn mobilebar" onclick="toggleSide()">☰</button><div class="brand">PIPS MASTER <span class="muted">ACADEMY</span></div></div><div class="top-actions"><button class="iconbtn" onclick="toggleTheme()">${prefs.theme==='dark'?'☀️':'🌙'}</button><div class="bellwrap"><button class="iconbtn" onclick="toggleNotifs()">🔔</button><i class="badge-dot"></i></div></div></header><div id="notifpanel" class="notifpanel"></div><div class="layout"><aside id="side" class="side">${nav()}</aside><main>${sections()}</main></div></div>`;renderHome();loadNotifs()}
function nav(){let items=[['home','⌂ Home'],['signals','◈ Signals'],['daytrade','◉ Day Trade'],['calculator','▣ Calculator'],['progress','☆ My Progress'],['referrals','↗ Referrals'],['community','☷ Community'],['feedback','✎ Feedback'],['notifications','🔔 Notifications'],['history','◌ Scanner History'],['performance','▥ Scanner Performance'],['learning','🎓 Learning Mode'],['journal','📝 Journal'],['profile','◉ My Profile']];return items.map(x=>`<button class="nav ${current===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function sections(){return `<section id="home" class="section active"></section><section id="signals" class="section"></section><section id="daytrade" class="section"></section><section id="calculator" class="section"></section><section id="progress" class="section"></section><section id="referrals" class="section"></section><section id="community" class="section"></section><section id="feedback" class="section"></section><section id="notifications" class="section"></section><section id="history" class="section"></section><section id="performance" class="section"></section><section id="learning" class="section"></section><section id="journal" class="section"></section><section id="profile" class="section"></section>`}
async function init(){if(!token)return auth();try{me=await api('/me');prefs=await api('/preferences');theme();shell();}catch(e){localStorage.removeItem('PMA_TOKEN');token=null;auth()}}
function auth(){document.body.classList.remove('dark');$('#root').innerHTML=`<div class="auth"><div class="authbox"><div class="eyebrow">PIPS MASTER ACADEMY</div><div class="h1">Welcome back</div><p class="muted">Sign in to your academy dashboard.</p><form onsubmit="event.preventDefault();login()"><input id="email" class="input" placeholder="Email" type="email" required><br><br><input id="password" class="input" placeholder="Password" type="password" required><br><br><button class="btn" style="width:100%">Sign in</button></form><p class="small" style="margin-top:14px">New member? <button class="btn secondary" onclick="registerForm()">Create account</button></p></div></div>`}
function registerForm(){ $('#root').innerHTML=`<div class="auth"><div class="authbox"><div class="eyebrow">PIPS MASTER ACADEMY</div><div class="h1">Create account</div><form onsubmit="event.preventDefault();register()"><input id="name" class="input" placeholder="Full name" required><br><br><input id="username" class="input" placeholder="Username" required><br><br><input id="email" class="input" placeholder="Email" type="email" required><br><br><input id="password" class="input" placeholder="Password" type="password" required><br><br><input id="ref" class="input" placeholder="Referral code (optional)"><br><br><button class="btn" style="width:100%">Create account</button></form><p class="small" style="margin-top:14px"><button class="btn secondary" onclick="auth()">Back to login</button></p></div></div>`}
async function login(){try{let x=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});token=x.token;localStorage.setItem('PMA_TOKEN',token);me=x.user;prefs=await api('/preferences');theme();shell()}catch(e){toast(e.message)}}
async function register(){try{let x=await api('/auth/register',{method:'POST',body:JSON.stringify({full_name:$('#name').value,username:$('#username').value,email:$('#email').value,password:$('#password').value,referral_code:$('#ref').value})});token=x.token;localStorage.setItem('PMA_TOKEN',token);me=x.user;prefs=await api('/preferences');theme();shell()}catch(e){toast(e.message)}}
function go(id){current=id;$('#side').classList.remove('open');$$('.section').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav').forEach(x=>x.classList.remove('active'));$$('.nav').forEach(x=>{if(x.textContent.toLowerCase().includes(id.replace('daytrade','day trade')))x.classList.add('active')});({home:renderHome,signals:renderSignals,daytrade:renderDaytrade,calculator:renderCalculator,progress:renderProgress,referrals:renderReferrals,community:renderCommunity,feedback:renderFeedback,notifications:renderNotifications,history:renderHistory,performance:renderPerformance,learning:renderLearning,journal:renderJournal,profile:renderProfile}[id]||renderHome)()}
function toggleSide(){$('#side').classList.toggle('open')}
async function toggleTheme(){prefs.theme=prefs.theme==='dark'?'light':'dark';theme();try{await api('/preferences',{method:'PUT',body:JSON.stringify(prefs)})}catch(e){toast('Theme could not be saved')}}
function toggleNotifs(){$('#notifpanel').classList.toggle('open');loadNotifs()}
async function loadNotifs(){if(!token)return;try{let ns=await api('/notifications');let p=$('#notifpanel');if(p)p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>Notifications</b><button class="btn secondary" onclick="clearTopNotifs()">Clear</button></div>${ns.filter(n=>!n.cleared).map(n=>`<div class="notif" onclick="openNotif(${n.id},'${escape(n.target||'notifications')}')"><div class="notiftitle">${escape(n.title)}</div><div class="small">${escape(n.message)}</div><div class="small">${new Date(n.created_at).toLocaleString()}</div></div>`).join('')||'<div class="empty">No recent notifications</div>'}`; }catch(e){}}
async function clearTopNotifs(){try{await api('/notifications/clear',{method:'POST'});toast('Recent notifications cleared');loadNotifs();}catch(e){toast(e.message)}}
async function openNotif(id,target){try{await api('/notifications/read/'+id,{method:'POST'});go(target&&document.getElementById(target)?target:'notifications')}catch(e){go('notifications')}}
async function renderHome(){let s=$('#home');if(!s)return;try{let [p,t,r]=await Promise.all([api('/progress'),api('/tasks'),api('/referrals')]);s.innerHTML=`<div class="hero"><div><div class="eyebrow">ACADEMY DASHBOARD</div><div class="h1">Welcome back, ${escape(me.username||me.full_name||'Member')}</div><div class="muted">Your long-term learning and market workspace.</div></div></div><div class="grid4"><div class="mini"><div class="label">Academy Rank</div><div class="value">${escape(p.rank)}</div><span class="rank-badge">🏅 ${escape(p.rank)}</span></div><div class="mini"><div class="label">Learning</div><div class="value">${p.learning_percent}%</div><div class="progress"><i style="width:${p.learning_percent}%"></i></div></div><div class="mini"><div class="label">Referrals</div><div class="value">${p.qualified_referrals}</div><div class="small">${p.pending_referrals} pending</div></div><div class="mini"><div class="label">Overall</div><div class="value">${p.overall_percent}%</div><div class="progress"><i style="width:${p.overall_percent}%"></i></div></div></div><div class="cards"><div class="card"><h3>Market context</h3><div class="trend">${[['15m','Bullish','bull'],['30m','Neutral','neutral'],['1H','Bearish','bear'],['4H','Bearish','bear'],['1D','Neutral','neutral']].map(x=>`<div class="trendcard ${x[2]}">${x[0]}<br><span style="font-size:12px">${x[1]}</span></div>`).join('')}</div></div><div class="card"><h3>Today's tasks</h3>${t.slice(0,4).map(x=>`<div class="notif" style="cursor:default"><input type="checkbox" ${x.done?'checked':''} onchange="doneTask(${x.id},this.checked)"> ${escape(x.title)}</div>`).join('')}</div></div>`}catch(e){s.innerHTML=`<div class="card"><h3>Dashboard data</h3><p class="muted">Connect to the deployed API to load your progress.</p><button class="btn" onclick="renderHome()">Try again</button></div>`}}
async function doneTask(id,done){try{await api('/tasks/'+id,{method:'POST',body:JSON.stringify({done})});renderHome()}catch(e){toast(e.message)}}
function scannerControls(){return `<div class="toolbar"><select id="style" class="select" onchange="saveScannerPrefs()"><option ${prefs.trading_style==='Scalping'?'selected':''}>Scalping</option><option ${prefs.trading_style==='Day Trading'?'selected':''}>Day Trading</option><option ${prefs.trading_style==='Swing Trading'?'selected':''}>Swing Trading</option></select><select id="tf" class="select" onchange="saveScannerPrefs()">${['1m','5m','15m','30m','1H','4H'].map(x=>`<option ${prefs.trigger_tf===x?'selected':''}>${x}</option>`).join('')}</select><select id="market" class="select"><option>Forex</option><option>Metals</option><option>Indices</option><option>Crypto</option><option>Commodities</option></select><input id="symbols" class="input" style="max-width:260px" value="EURUSD,USDCHF,GBPUSD" placeholder="Symbols"><button class="btn" onclick="runScan()">Run Scanner</button></div>`}
async function saveScannerPrefs(){prefs.trading_style=$('#style').value;prefs.trigger_tf=$('#tf').value;try{await api('/preferences',{method:'PUT',body:JSON.stringify(prefs)})}catch(e){}}
async function renderSignals(){let s=$('#signals');s.innerHTML=`<div class="hero"><div><div class="eyebrow">AUTOMATED SCANNER</div><div class="h1">Signal Engine</div><div class="muted">Select your trading style and trigger timeframe. The engine uses verified market-data checks and multiple confirmations.</div></div></div>${scannerControls()}<div id="scanout" class="scanner-grid"><div class="card"><div class="empty">Run the scanner to analyze your selected symbols.</div></div></div>`}
async function runScan(){try{await saveScannerPrefs();let x=await api('/signals/scan?market='+encodeURIComponent($('#market').value)+'&symbols='+encodeURIComponent($('#symbols').value)+'&style='+encodeURIComponent($('#style').value)+'&timeframe='+encodeURIComponent($('#tf').value));scanCache=x.results;$('#scanout').innerHTML=x.results.map(renderSignal).join('');}catch(e){toast(e.message)}}
function renderSignal(x){let cls=x.direction==='BUY'?'buy':x.direction==='SELL'?'sell':'';return `<article class="signal ${cls}"><div class="signalhead"><div><div class="direction ${x.direction==='BUY'?'buytext':'selltext'}">${x.direction}</div><b>${escape(x.symbol)}</b><div class="small">${escape(x.style)} · ${escape(x.timeframe)}</div></div><div style="text-align:right"><div class="conf">${x.confidence}</div><div class="small">Setup confidence</div><b>${escape(x.strength)}</b></div></div>${x.verified?`<div class="levels">${[['Entry',x.entry],['Stop loss',x.sl],['TP1',x.tp1],['TP2',x.tp2]].map(v=>`<div class="level"><small>${v[0]} <button class="copy" onclick="copyVal('${v[1]}','${v[0]}')">Copy</button></small><strong>${v[1]}</strong></div>`).join('')}</div><div class="chips">${x.confirmations.slice(0,8).map(c=>`<span class="chip">✓ ${escape(c)}</span>`).join('')}</div><div class="row" style="margin-top:12px"><div><div class="small">Next setup estimate</div><b>${x.estimated_candles} candles · ~${x.estimated_minutes} min</b></div><div><div class="small">Status</div><b>${escape(x.next_signal)}</b></div></div><p class="small" style="margin-bottom:0">${escape(x.reasons.join(' · '))}</p><p class="small">Data: ${escape(x.data_source)} · ${new Date(x.data_timestamp).toLocaleString()}</p>`:`<div class="empty">${escape(x.next_signal||'Verified market data unavailable')}</div>`}</article>`}
async function copyVal(v,label){try{await navigator.clipboard.writeText(v);toast(label+' copied')}catch(e){toast('Copy failed')}}
function renderDaytrade(){let s=$('#daytrade');s.innerHTML=`<div class="hero"><div><div class="eyebrow">DAY TRADE MONITOR</div><div class="h1">Fine-tuned view</div><div class="muted">Choose the trigger timeframe that matches your style.</div></div></div><div class="grid4">${[['1m','Scalp'],['5m','Scalp'],['15m','Day trade'],['1H','Swing context']].map(x=>`<div class="mini"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="muted">Use the scanner for the actual setup and locked levels.</div><button class="btn secondary" style="margin-top:10px" onclick="prefs.trigger_tf='${x[0]}';go('signals')">Use ${x[0]}</button></div>`).join('')}</div>`}
function renderCalculator(){let s=$('#calculator');s.innerHTML=`<div class="h1">Calculator Hub</div><div class="grid4"><div class="card"><h3>Risk</h3><input id="bal" class="input" placeholder="Account size"><br><br><input id="risk" class="input" placeholder="Risk %"><br><br><button class="btn" onclick="calcRisk()">Calculate</button><p id="riskout" class="muted"></p></div><div class="card"><h3>Risk : Reward</h3><input id="rsk" class="input" placeholder="Risk distance"><br><br><input id="rew" class="input" placeholder="Reward distance"><br><br><button class="btn" onclick="$('#rrout').textContent='R:R = '+(Number($('#rew').value)/Number($('#rsk').value||1)).toFixed(2)">Calculate</button><p id="rrout" class="muted"></p></div><div class="card"><h3>Compounding</h3><p class="small">Illustrative only; not a guarantee.</p><input class="input" id="cp" placeholder="Starting amount"><br><br><input class="input" id="cr" placeholder="Rate %"><br><br><input class="input" id="cn" placeholder="Periods"><br><br><button class="btn" onclick="let v=Number($('#cp').value)*Math.pow(1+Number($('#cr').value)/100,Number($('#cn').value));$('#cout').textContent='Illustrative result: '+v.toFixed(2)">Calculate</button><p id="cout" class="muted"></p></div><div class="card"><h3>Pip Value</h3><p class="muted">Use this as a practice calculator; symbol-specific contract specifications can vary.</p></div></div>`}
function calcRisk(){let v=Number($('#bal').value||0)*Number($('#risk').value||0)/100;$('#riskout').textContent='Risk amount: '+v.toFixed(2)}
async function renderProgress(){let s=$('#progress');try{let p=await api('/progress');let ach=await api('/achievements').catch(()=>[]);s.innerHTML=`<div class="h1">My Progress</div><div class="grid4"><div class="mini"><div class="label">Rank</div><div class="value">${p.rank}</div><span class="rank-badge">🏅 Academy Rank</span></div><div class="mini"><div class="label">XP</div><div class="value">${p.xp}</div></div><div class="mini"><div class="label">Learning</div><div class="value">${p.learning_percent}%</div></div><div class="mini"><div class="label">Streak</div><div class="value">${p.streak} days</div></div></div><div class="card" style="margin-top:14px"><h3>Overall progress</h3><div class="progress"><i style="width:${p.overall_percent}%"></i></div><p class="muted">Tasks: ${p.tasks_done}/${p.tasks_total} · Qualified referrals: ${p.qualified_referrals}</p></div>`}catch(e){s.innerHTML='<div class="card"><h3>My Progress</h3><p class="muted">Progress could not be loaded from the deployed API.</p><button class="btn" onclick="renderProgress()">Try again</button></div>'}}
async function renderReferrals(){let s=$('#referrals');try{let r=await api('/referrals');s.innerHTML=`<div class="h1">Monthly Referrals</div><p class="muted">No target. Position is based on qualified referrals for the current month.</p><div class="podium">${[r.top10[1],r.top10[0],r.top10[2]].map((x,i)=>`<div class="place ${i===1?'first':''}"><b>${['🥈 2nd','🥇 1st','🥉 3rd'][i]}</b><div class="value">${x?x.referrals:0}</div><div>${x?escape(x.username):'—'}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Top 10 this month</h3><div class="tablewrap"><table class="table"><tr><th>#</th><th>Member</th><th>Referrals</th></tr>${r.top10.map(x=>`<tr><td>${x.position}</td><td>${escape(x.username)}</td><td>${x.referrals}</td></tr>`).join('')}</table></div><p><b>Your position: #${r.my_position}</b> · Your referrals: ${r.my_referrals}</p><p class="muted">Qualified: ${r.qualified} · Pending: ${r.pending}</p><p class="small">Referral code: <button class="btn secondary" onclick="copyVal('${r.referral_code}','Referral code')">Copy referral code</button></p></div>`}catch(e){s.innerHTML='<div class="card">Unable to load referrals.</div>'}}
async function renderCommunity(){let s=$('#community');try{let rows=await api('/community');s.innerHTML=`<div class="h1">Community</div><div class="card"><div id="msgs" style="max-height:55vh;overflow:auto">${rows.map(m=>`<div class="notif"><b>${escape(m.username||m.full_name)}</b><span class="small"> · ${new Date(m.created_at).toLocaleString()}</span><div style="margin-top:6px">${escape(m.message)}</div></div>`).join('')||'<div class="empty">No messages yet.</div>'}</div><div class="card" style="margin-top:12px"><textarea id="msg" class="textarea" rows="3" placeholder="Write a message..."></textarea><button class="btn" style="margin-top:8px" onclick="sendMsg()">Send</button></div>`}catch(e){s.innerHTML='<div class="card">Unable to load community.</div>'}}
async function sendMsg(){let m=$('#msg').value.trim();if(!m)return;try{await api('/community',{method:'POST',body:JSON.stringify({message:m})});renderCommunity()}catch(e){toast(e.message)}}
async function renderFeedback(){let rows=await api('/feedback').catch(()=>[]);$('#feedback').innerHTML=`<div class="h1">Feedback</div><div class="row"><div class="card"><h3>Send feedback</h3><select id="rating" class="select"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><br><br><textarea id="fb" class="textarea" rows="5" placeholder="Tell us what you think..."></textarea><br><br><button class="btn" onclick="sendFeedback()">Submit feedback</button></div><div class="card"><h3>Recent feedback</h3>${rows.slice(0,8).map(x=>`<div class="notif"><b>${'★'.repeat(x.rating)}</b><div>${escape(x.message)}</div><div class="small">${escape(x.username||'Member')}</div></div>`).join('')||'<div class="empty">No feedback yet.</div>'}</div></div>`}
async function sendFeedback(){try{await api('/feedback',{method:'POST',body:JSON.stringify({rating:Number($('#rating').value),message:$('#fb').value})});toast('Feedback saved and XP added');renderFeedback();}catch(e){toast(e.message)}}
async function renderNotifications(){let rows=await api('/notifications');$('#notifications').innerHTML=`<div class="h1">Notifications</div><p class="muted">History is retained for 14 days and then automatically removed.</p><div class="card">${rows.map(n=>`<div class="notif" onclick="openNotif(${n.id},'${escape(n.target||'notifications')}')"><div class="notiftitle">${escape(n.title)}</div><div>${escape(n.message)}</div><div class="small">${new Date(n.created_at).toLocaleString()}</div></div>`).join('')||'<div class="empty">No notifications.</div>'}</div>`}
async function renderHistory(){let rows=await api('/scanner/history');$('#history').innerHTML=`<div class="h1">Scanner History</div><div class="card tablewrap"><table class="table"><tr><th>Time</th><th>Symbol</th><th>Direction</th><th>TF</th><th>Confidence</th><th>Entry</th><th>Status</th></tr>${rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.symbol}</td><td>${x.direction}</td><td>${x.timeframe}</td><td>${x.confidence}</td><td>${x.entry}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="7">No recorded setups yet.</td></tr>'}</table></div>`}
async function renderPerformance(){let p=await api('/scanner/performance');$('#performance').innerHTML=`<div class="h1">Scanner Performance</div><div class="grid4">${[['Recorded setups',p.total_setups],['80+ confidence',p.high_confidence],['BUY setups',p.buy_setups],['SELL setups',p.sell_setups]].map(x=>`<div class="mini"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><p class="muted">${p.note}</p></div>`}
function renderLearning(){let s=$('#learning');s.innerHTML=`<div class="h1">Learning Mode</div><div class="grid4">${['Supply & Demand','Market Structure','Liquidity','Risk & Reward','RSI & Momentum','Break & Retest','Support & Resistance','Candlestick Confirmation'].map((x,i)=>`<div class="mini"><div class="label">Lesson ${i+1}</div><div class="value">${x}</div><p class="muted">Learn the concept behind scanner confirmations.</p><button class="btn secondary" onclick="toast('Lesson opened')">Open lesson</button></div>`).join('')}</div>`}
async function renderJournal(){let s=$('#journal');let rows=await api('/journal').catch(()=>[]);s.innerHTML=`<div class="h1">Learning Journal</div><div class="card"><textarea id="journaltext" class="textarea" rows="6" placeholder="What did you learn today? What would you do differently?"></textarea><button class="btn" style="margin-top:10px" onclick="saveJournal()">Save note</button></div><div class="card" style="margin-top:12px"><h3>Previous notes</h3>${rows.map(x=>`<div class="notif"><div>${escape(x.note)}</div><div class="small">${new Date(x.created_at).toLocaleString()}</div></div>`).join('')||'<div class="empty">No journal notes yet.</div>'}</div>`} async function saveJournal(){let n=$('#journaltext').value.trim();if(!n)return;try{await api('/journal',{method:'POST',body:JSON.stringify({note:n})});toast('Journal saved to your account');renderJournal()}catch(e){toast(e.message)}}
async function renderProfile(){let u=await api('/me');let adminHtml='';if(u.role==='admin'){let a=await api('/admin/status').catch(()=>({}));adminHtml=`<div class="card" style="margin-top:14px"><h3>Admin controls</h3><p>Server verified administrator.</p><div class="grid4"><div class="mini"><div class="label">Users</div><div class="value">${a.users||0}</div></div><div class="mini"><div class="label">Feedback</div><div class="value">${a.feedback||0}</div></div><div class="mini"><div class="label">Messages</div><div class="value">${a.messages||0}</div></div><div class="mini"><div class="label">Community</div><div class="value">${a.community||'open'}</div></div></div></div>`}$('#profile').innerHTML=`<div class="h1">My Profile</div><div class="card"><div class="formgrid"><div><label class="small">Full name</label><input id="pfname" class="input" value="${escape(u.full_name)}"></div><div><label class="small">Username</label><input id="puser" class="input" value="${escape(u.username)}"></div><div><label class="small">Phone</label><input id="pphone" class="input" value="${escape(u.phone)}"></div><div><label class="small">Date of birth</label><input id="pdob" class="input" value="${escape(u.dob)}"></div><div><label class="small">Email (protected)</label><input class="input" value="${escape(u.email)}" readonly></div><div><label class="small">PMA ID (protected)</label><input class="input" value="${escape(u.pma_id)}" readonly></div></div><br><label class="small">New password (optional)</label><input id="ppass" class="input" type="password"><button class="btn" style="margin-top:12px" onclick="saveProfile()">Save profile</button><button class="btn secondary" style="margin-left:8px" onclick="logout()">Log out</button></div><div class="card" style="margin-top:14px"><h3>Referral code</h3><button class="btn secondary" onclick="copyVal('${u.referral_code}','Referral code')">Copy referral code</button></div>${adminHtml}`}
async function saveProfile(){try{me=await api('/profile',{method:'PUT',body:JSON.stringify({full_name:$('#pfname').value,username:$('#puser').value,phone:$('#pphone').value,dob:$('#pdob').value,profile_picture:me.profile_picture||'',password:$('#ppass').value})});toast('Profile saved');renderProfile()}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem('PMA_TOKEN');token=null;me=null;auth()}
init();
</script></body></html>
